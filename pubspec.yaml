name: gymbroo
description: "Gymbroo - an offline workout tracker that roasts you for skipping."
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
