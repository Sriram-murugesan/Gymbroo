# Tuned for a 7 GB RAM machine (Flutter's default asks for an 8 GB heap).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=640m -XX:ReservedCodeCacheSize=200m -XX:+UseSerialGC
kotlin.daemon.jvmargs=-Xmx512m -XX:+UseSerialGC
org.gradle.workers.max=2
org.gradle.parallel=false
# Compile Kotlin inside the Gradle process instead of spawning a second big JVM.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
